name: Build SUBSENSE-X APK
on:
  push:
    branches: [subsensex-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: SubsenseX
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SUBSENSE-X-debug-apk
          path: SubsenseX/app/build/outputs/apk/debug/app-debug.apk
